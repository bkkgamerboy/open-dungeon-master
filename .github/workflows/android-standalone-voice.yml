name: Build standalone Android voice APK

on:
  push:
    branches: [android-standalone-voice-mvp]
    paths:
      - 'android-standalone/**'
      - 'src/lib/native-narration.ts'
      - 'src/app/campaigns/**'
      - '.github/workflows/android-standalone-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-payload:
    name: Bundle game engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-dungeon-master
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Lebbitheplow/open-dungeon-master-client
          ref: v0.18.0
          path: client
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Bundle server from our voice-enabled fork
        working-directory: client
        env:
          ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master
        run: npm run bundle-server
      - name: Package embedded game engine
        working-directory: client
        run: |
          find vendor/server -type l -delete
          tar -C vendor -czf server-payload.tgz server
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-game-engine
          path: client/server-payload.tgz
          retention-days: 2
          if-no-files-found: error

  android:
    name: Build phone-hosted APK
    runs-on: ubuntu-latest
    needs: server-payload
    timeout-minutes: 45
    env:
      NODE_ANDROID_RELEASE: node-android-v24.20.0
      CLOUDFLARED_ANDROID_RELEASE: cloudflared-android-2026.8.3
    steps:
      - uses: actions/checkout@v4
        with:
          path: open-dungeon-master
      - uses: actions/checkout@v4
        with:
          repository: Lebbitheplow/open-dungeon-master-client
          ref: v0.18.0
          path: client
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android client dependencies
        working-directory: client
        run: npm ci
      - name: Install Android mobile dependencies
        working-directory: client/mobile
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: standalone-game-engine
          path: client
      - name: Restore game payload and module aliases
        working-directory: client
        run: |
          mkdir -p vendor
          tar -C vendor -xzf server-payload.tgz
          node scripts/alias-server-modules.mjs
      - name: Confirm game screens and engine match
        run: |
          built=$(node -p "require('./client/vendor/server/odm-payload.json').commit")
          here=$(git -C open-dungeon-master rev-parse HEAD)
          case "$here" in "$built"*) echo "Bundled source $built" ;; *)
            echo "::error::Server code did not match"; exit 1 ;;
          esac
      - name: Add our on-phone narration and separate app identity
        run: python3 open-dungeon-master/android-standalone/patch-client.py client
      - name: Download checked Android Node and tunnel runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Lebbitheplow/open-dungeon-master-client
        working-directory: client
        run: |
          mkdir -p mobile/runtime
          gh release download "$NODE_ANDROID_RELEASE" --pattern '*.tar.gz' --dir mobile/runtime
          gh release download "$CLOUDFLARED_ANDROID_RELEASE" --pattern '*.tar.gz' --dir mobile/runtime
          (cd mobile/runtime && sha256sum --strict -c ../runtime.sha256)
          tar -C mobile/runtime -xzf "mobile/runtime/$NODE_ANDROID_RELEASE.tar.gz"
          tar -C mobile/runtime -xzf "mobile/runtime/$CLOUDFLARED_ANDROID_RELEASE.tar.gz"
      - name: Compile mobile UI and synchronize Android
        working-directory: client/mobile
        run: npm run sync
      - name: Bundle embedded game and native runtimes
        working-directory: client/mobile
        run: npm run bundle-payload
      - name: Build side-by-side Android debug APK
        working-directory: client/mobile/android
        run: ./gradlew assembleDebug --stacktrace
      - name: Collect Samsung arm64 APK
        run: |
          apk=$(find client/mobile/android/app/build/outputs/apk/debug -type f -name '*arm64*v8a*.apk' -print -quit)
          test -n "$apk" || { find client/mobile/android/app/build/outputs/apk -name '*.apk'; exit 1; }
          cp "$apk" dungeon-master-standalone-voice.apk
          ls -lh dungeon-master-standalone-voice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Master-Standalone-Voice-APK
          path: dungeon-master-standalone-voice.apk
          retention-days: 30
          if-no-files-found: error
