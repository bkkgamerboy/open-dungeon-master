# Builds ODM Voice: the official Android app (CLIENT_REF) with
# android-voice/client.patch applied, carrying this branch's game screens
# and server inside it, and publishes the APK as a pre-release of this repo
# for download on the phone. See android-voice/README.md.
#
# Mirrors the official client's release workflow (payload and android
# jobs) in one job.
name: Android voice APK
on:
  workflow_dispatch:
  push:
    branches: [phone-voice]
    paths-ignore: ["**/*.md"]

permissions:
  contents: write

concurrency:
  group: android-voice-apk
  cancel-in-progress: true

env:
  ODM_SERVER_DIR: ${{ github.workspace }}/open-dungeon-master
  CLIENT_REPO: Lebbitheplow/open-dungeon-master-client
  # Client 0.18.0, the release built on server 0.27.0. client.patch applies to it.
  CLIENT_REF: 184b938600ec78ac7c60a33fc43108b79f254985
  NODE_ANDROID_RELEASE: node-android-v24.20.0
  CLOUDFLARED_ANDROID_RELEASE: cloudflared-android-2026.8.3
  APP_ID: com.opendungeonmaster.app.voice
  APP_NAME: ODM Voice

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Room for the server build and Gradle
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h . | tail -1
      - name: The signing password is set
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ODM_VOICE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository secret ODM_VOICE_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions) and run this again."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: open-dungeon-master
          # The client's bundle-server.mjs builds from a git worktree of HEAD,
          # so it needs real history, not a shallow grafted checkout.
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ env.CLIENT_REF }}
          path: client
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Add the phone's voice and the Read aloud fix to the app
        working-directory: client
        run: |
          git apply --check ../open-dungeon-master/android-voice/client.patch
          git apply ../open-dungeon-master/android-voice/client.patch
          git status --short
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Install server dependencies
        working-directory: open-dungeon-master
        run: npm ci
      - name: Phone voice tests
        working-directory: open-dungeon-master
        run: node scripts/test-phone-voice.mjs && node scripts/test-narration-default.mjs && node scripts/test-campaign-reducer.mjs
      - name: Bundle the server payload
        working-directory: client
        run: npm run bundle-server
      - name: Install mobile dependencies
        working-directory: client/mobile
        run: npm ci
      - name: Mobile tests and type check
        working-directory: client/mobile
        run: npm test && npm run typecheck
      # Both run as native code inside the APK, so each tarball must be the
      # one mobile/runtime.sha256 names before it is unpacked.
      - name: Fetch the Node runtime and cloudflared for Android
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mobile/runtime
          gh release download "$NODE_ANDROID_RELEASE" --repo "$CLIENT_REPO" --pattern '*.tar.gz' --dir mobile/runtime
          gh release download "$CLOUDFLARED_ANDROID_RELEASE" --repo "$CLIENT_REPO" --pattern '*.tar.gz' --dir mobile/runtime
          (cd mobile/runtime && sha256sum --strict -c ../runtime.sha256)
          tar -C mobile/runtime -xzf "mobile/runtime/$NODE_ANDROID_RELEASE.tar.gz"
          tar -C mobile/runtime -xzf "mobile/runtime/$CLOUDFLARED_ANDROID_RELEASE.tar.gz"
      - name: Build web assets and sync Capacitor
        working-directory: client/mobile
        run: npm run sync
      - name: Stage the server payload and runtime into the app
        working-directory: client/mobile
        run: npm run bundle-payload
      - name: A separate app beside the official one
        working-directory: client/mobile/android
        run: |
          sed -i "s/applicationId \"com.opendungeonmaster.app\"/applicationId \"$APP_ID\"/" app/build.gradle
          grep -q "applicationId \"$APP_ID\"" app/build.gradle
          sed -i "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">$APP_NAME</string>#; s#<string name=\"title_activity_main\">[^<]*</string>#<string name=\"title_activity_main\">$APP_NAME</string>#" app/src/main/res/values/strings.xml
          grep -q ">$APP_NAME<" app/src/main/res/values/strings.xml
      - name: Build the signed APK
        working-directory: client/mobile/android
        env:
          ODM_ANDROID_KEYSTORE: ${{ github.workspace }}/open-dungeon-master/android-voice/voice.keystore
          ODM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ODM_VOICE_KEYSTORE_PASSWORD }}
          ODM_ANDROID_KEY_ALIAS: odm-voice
        run: |
          df -h . | tail -1
          ./gradlew assembleRelease --stacktrace
      - name: R8 kept what the plugin bridge calls by name
        working-directory: client
        run: node mobile/scripts/check-r8-keeps.mjs mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./client/package.json').version")
          tag="voice-${version}-build${GITHUB_RUN_NUMBER}"
          apk="ODM-Voice-${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp client/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "$apk"
          sha256sum "$apk"
          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ODM Voice ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Open Dungeon Master ${version} with the phone's own voice for narration and the Read aloud fix. Server $(git -C open-dungeon-master rev-parse --short HEAD), client ${CLIENT_REF:0:7} + android-voice/client.patch. Installs beside the official app as ODM Voice."
      - name: Keep the APK with the run too
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odm-voice-apk
          path: ODM-Voice-*.apk
          retention-days: 14
